openapi: 3.0.3

info:
  title: CAB System - User Service API
  description: API quản lý tài khoản khách hàng của CAB System
  version: 1.0.0

servers:
  - url: http://localhost:8081/api/v1
    description: Local server

tags:
  - name: Authentication
    description: Xác thực khách hàng
  - name: Customer
    description: Quản lý tài khoản khách hàng

paths:

  /auth/register:
    post:
      tags:
        - Authentication
      summary: Đăng ký tài khoản khách hàng
      operationId: registerCustomer

      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'

      responses:
        '201':
          description: Đăng ký tài khoản thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerResponse'

        '400':
          description: Thông tin đăng ký không hợp lệ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auth/login:
    post:
      tags:
        - Authentication
      summary: Đăng nhập khách hàng
      operationId: loginCustomer

      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'

      responses:
        '200':
          description: Đăng nhập thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'

        '401':
          description: Thông tin đăng nhập không hợp lệ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /customers/me:
    get:
      tags:
        - Customer
      summary: Xem thông tin cá nhân
      operationId: getCustomerProfile
      security:
        - bearerAuth: []

      responses:
        '200':
          description: Lấy thông tin thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerResponse'

        '401':
          description: Chưa xác thực
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    put:
      tags:
        - Customer
      summary: Cập nhật thông tin cá nhân
      operationId: updateCustomerProfile
      security:
        - bearerAuth: []

      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCustomerRequest'

      responses:
        '200':
          description: Cập nhật thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerResponse'

        '400':
          description: Dữ liệu không hợp lệ

        '401':
          description: Chưa xác thực

components:

  securitySchemes:

    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:

    RegisterRequest:
      type: object
      required:
        - fullName
        - phone
        - email
        - password
      properties:
        fullName:
          type: string
          example: Nguyen Van A
        phone:
          type: string
          example: "0901234567"
        email:
          type: string
          format: email
          example: nguyenvana@gmail.com
        password:
          type: string
          format: password
          example: "123456"

    LoginRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          example: nguyenvana@gmail.com
        password:
          type: string
          format: password
          example: "123456"

    UpdateCustomerRequest:
      type: object
      properties:
        fullName:
          type: string
          example: Nguyen Van A
        phone:
          type: string
          example: "0901234567"
        email:
          type: string
          format: email
          example: nguyenvana@gmail.com

    CustomerResponse:
      type: object
      properties:
        customerId:
          type: integer
          example: 1
        fullName:
          type: string
          example: Nguyen Van A
        phone:
          type: string
          example: "0901234567"
        email:
          type: string
          example: nguyenvana@gmail.com

    LoginResponse:
      type: object
      properties:
        accessToken:
          type: string
          example: eyJhbGciOiJIUzI1NiJ9...
        customer:
          $ref: '#/components/schemas/CustomerResponse'

    ErrorResponse:
      type: object
      properties:
        errorCode:
          type: string
          example: INVALID_REQUEST
        message:
          type: string
          example: Thông tin không hợp lệ
