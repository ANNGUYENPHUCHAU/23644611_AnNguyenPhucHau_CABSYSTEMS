openapi: 3.0.3

info:
  title: CAB System - Trip Service API
  description: API đặt xe, phân công tài xế và quản lý chuyến xe
  version: 1.0.0

servers:
  - url: http://localhost:8083/api/v1
    description: Local server

tags:
  - name: Trip
    description: Quản lý chuyến xe
  - name: Dispatch
    description: Tìm và phân công tài xế

paths:

  /trips:
    post:
      tags:
        - Trip
      summary: Tạo yêu cầu đặt xe
      operationId: createTrip

      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTripRequest'

      responses:
        '201':
          description: Yêu cầu đặt xe được tạo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TripResponse'

        '400':
          description: Dữ liệu đặt xe không hợp lệ

  /trips/{tripId}:
    get:
      tags:
        - Trip
      summary: Xem thông tin chuyến xe
      operationId: getTrip

      parameters:
        - $ref: '#/components/parameters/TripId'

      responses:
        '200':
          description: Thông tin chuyến xe
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TripResponse'

        '404':
          description: Không tìm thấy chuyến xe

  /trips/{tripId}/status:
    put:
      tags:
        - Trip
      summary: Cập nhật trạng thái chuyến xe
      operationId: updateTripStatus

      parameters:
        - $ref: '#/components/parameters/TripId'

      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TripStatusRequest'

      responses:
        '200':
          description: Cập nhật trạng thái thành công

  /trips/{tripId}/accept:
    post:
      tags:
        - Dispatch
      summary: Tài xế nhận chuyến
      operationId: acceptTrip

      parameters:
        - $ref: '#/components/parameters/TripId'

      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DriverActionRequest'

      responses:
        '200':
          description: Tài xế đã nhận chuyến

        '409':
          description: Chuyến không còn khả dụng

  /trips/{tripId}/reject:
    post:
      tags:
        - Dispatch
      summary: Tài xế từ chối chuyến
      operationId: rejectTrip

      parameters:
        - $ref: '#/components/parameters/TripId'

      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DriverActionRequest'

      responses:
        '200':
          description: Tài xế từ chối chuyến và hệ thống tiếp tục tìm tài xế khác

  /trips/{tripId}/driver:
    get:
      tags:
        - Trip
      summary: Xem tài xế của chuyến xe
      operationId: getTripDriver

      parameters:
        - $ref: '#/components/parameters/TripId'

      responses:
        '200':
          description: Thông tin tài xế
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DriverResponse'

        '404':
          description: Chuyến chưa có tài xế

  /trips/{tripId}/eta:
    get:
      tags:
        - Trip
      summary: Xem thời gian dự kiến tài xế đến
      operationId: getTripEta

      parameters:
        - $ref: '#/components/parameters/TripId'

      responses:
        '200':
          description: Thời gian dự kiến đến
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EtaResponse'

  /trips/history:
    get:
      tags:
        - Trip
      summary: Xem lịch sử chuyến xe
      operationId: getTripHistory

      responses:
        '200':
          description: Danh sách lịch sử chuyến xe
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TripResponse'

components:

  parameters:

    TripId:
      name: tripId
      in: path
      required: true
      schema:
        type: integer
      example: 1001

  schemas:

    CreateTripRequest:
      type: object
      required:
        - customerId
        - pickupLocation
        - destination
        - vehicleType
      properties:
        customerId:
          type: integer
          example: 1
        pickupLocation:
          type: string
          example: "IUH, Go Vap, Ho Chi Minh City"
        destination:
          type: string
          example: "Ben Thanh Market, Ho Chi Minh City"
        vehicleType:
          type: string
          example: CAR

    TripResponse:
      type: object
      properties:
        tripId:
          type: integer
          example: 1001
        customerId:
          type: integer
          example: 1
        driverId:
          type: integer
          nullable: true
          example: 25
        pickupLocation:
          type: string
          example: "IUH, Go Vap"
        destination:
          type: string
          example: "Ben Thanh Market"
        vehicleType:
          type: string
          example: CAR
        status:
          type: string
          enum:
            - SEARCHING_DRIVER
            - DRIVER_ASSIGNED
            - DRIVER_ARRIVED
            - PASSENGER_PICKED_UP
            - IN_PROGRESS
            - COMPLETED
        fare:
          type: number
          format: double
          nullable: true
          example: 85000

    TripStatusRequest:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          enum:
            - DRIVER_ARRIVED
            - PASSENGER_PICKED_UP
            - IN_PROGRESS
            - COMPLETED

    DriverActionRequest:
      type: object
      required:
        - driverId
      properties:
        driverId:
          type: integer
          example: 25

    DriverResponse:
      type: object
      properties:
        driverId:
          type: integer
          example: 25
        fullName:
          type: string
          example: Tran Van B
        phone:
          type: string
          example: "0912345678"
        vehicleType:
          type: string
          example: CAR
        licensePlate:
          type: string
          example: 51A-12345

    EtaResponse:
      type: object
      properties:
        estimatedArrivalMinutes:
          type: integer
          example: 7
