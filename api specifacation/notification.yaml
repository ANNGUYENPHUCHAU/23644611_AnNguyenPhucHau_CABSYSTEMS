openapi: 3.0.3
info:
  title: CAB System - Rating Service API
  description: |
    API đánh giá tài xế sau chuyến.
    Lịch sử chuyến thuộc Trip Service; Rating Service chỉ sở hữu nghiệp vụ đánh giá.
    Traceability: FR18, UC05.
  version: 1.0.0

servers:
  - url: http://localhost:8086/api/v1
    description: Local Rating Service

tags:
  - name: Rating
    description: FR18 - Đánh giá tài xế

paths:
  /trips/{tripId}/ratings:
    post:
      tags: [Rating]
      summary: Đánh giá tài xế
      description: FR18, UC05. Khách hàng đánh giá tài xế sau khi chuyến hoàn thành.
      operationId: createRating
      security:
        - bearerAuth: []
      parameters:
        - name: tripId
          in: path
          required: true
          schema:
            type: string
            example: CD001
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RatingRequest'
      responses:
        '201':
          description: Đánh giá thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RatingResponse'
        '400':
          description: Điểm đánh giá không hợp lệ, chuyến chưa hoàn thành hoặc đã đánh giá
        '401':
          description: Chưa xác thực
        '404':
          description: Không tìm thấy chuyến

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    RatingRequest:
      type: object
      required: [score]
      properties:
        score:
          type: integer
          minimum: 1
          maximum: 5
          example: 5
        comment:
          type: string
          example: Tài xế phục vụ tốt.

    RatingResponse:
      type: object
      required: [ratingId, tripId, driverId, customerId, score]
      properties:
        ratingId:
          type: string
          example: RT001
        tripId:
          type: string
          example: CD001
        driverId:
          type: string
          example: TX001
        customerId:
          type: string
          example: KH001
        score:
          type: integer
          minimum: 1
          maximum: 5
          example: 5
        comment:
          type: string
        createdAt:
          type: string
          format: date-time
