openapi: 3.0.3

info:
  title: CAB System - Notification Service API
  description: |
    API gửi thông báo cho Customer và Driver khi phát sinh
    các sự kiện liên quan đến yêu cầu đặt xe, chuyến xe
    và kết quả thanh toán.

    Traceability:
    BG04 -> BR09 -> FR23 -> UC02, UC07, UC08, UC14 -> AC09
  version: 1.0.0

servers:
  - url: http://localhost:8085/api/v1
    description: Local Notification Service

tags:
  - name: Notification
    description: FR23 - Gửi thông báo theo sự kiện nghiệp vụ

paths:

  /internal/notifications:
    post:
      tags:
        - Notification

      summary: Tạo và gửi thông báo

      description: |
        API nội bộ được gọi khi phát sinh sự kiện nghiệp vụ.

        Theo AC09, hệ thống gửi thông báo khi:
        - Yêu cầu đặt xe được tiếp nhận.
        - Tài xế nhận chuyến.
        - Tài xế đến điểm đón.
        - Chuyến đi hoàn thành.
        - Thanh toán có kết quả.

        Tài xế cũng có thể nhận thông báo về chuyến mới
        hoặc thay đổi liên quan đến chuyến đang thực hiện.

      operationId: sendNotification

      security:
        - serviceAuth: []

      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateNotificationRequest'

      responses:

        '202':
          description: Yêu cầu gửi thông báo đã được tiếp nhận
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationResponse'

        '400':
          description: Dữ liệu thông báo không hợp lệ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

        '401':
          description: Service gọi API chưa được xác thực


  /internal/notifications/{notificationId}:
    get:
      tags:
        - Notification

      summary: Kiểm tra trạng thái thông báo

      description: |
        Tra cứu trạng thái xử lý của một thông báo
        đã được tạo trong Notification Service.

      operationId: getNotificationStatus

      security:
        - serviceAuth: []

      parameters:
        - name: notificationId
          in: path
          required: true
          schema:
            type: string
            example: NOTI001

      responses:

        '200':
          description: Lấy trạng thái thông báo thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationResponse'

        '401':
          description: Service gọi API chưa được xác thực

        '404':
          description: Không tìm thấy thông báo


components:

  securitySchemes:

    serviceAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT


  schemas:

    CreateNotificationRequest:
      type: object

      required:
        - recipientId
        - recipientType
        - eventType

      properties:

        recipientId:
          type: string
          description: Mã Customer hoặc Driver nhận thông báo
          example: KH001

        recipientType:
          type: string
          enum:
            - CUSTOMER
            - DRIVER
          example: CUSTOMER

        eventType:
          type: string
          description: Sự kiện nghiệp vụ làm phát sinh thông báo
          enum:
            - BOOKING_RECEIVED
            - DRIVER_ACCEPTED
            - DRIVER_ARRIVED
            - TRIP_COMPLETED
            - PAYMENT_RESULT
            - NEW_TRIP
            - TRIP_UPDATED
          example: DRIVER_ACCEPTED

        tripId:
          type: string
          nullable: true
          description: Mã chuyến xe liên quan nếu có
          example: CD001

        paymentId:
          type: string
          nullable: true
          description: Mã thanh toán nếu sự kiện liên quan thanh toán
          example: PAY001


    NotificationResponse:
      type: object

      required:
        - notificationId
        - recipientId
        - recipientType
        - eventType
        - status
        - createdAt

      properties:

        notificationId:
          type: string
          example: NOTI001

        recipientId:
          type: string
          example: KH001

        recipientType:
          type: string
          enum:
            - CUSTOMER
            - DRIVER

        eventType:
          type: string
          enum:
            - BOOKING_RECEIVED
            - DRIVER_ACCEPTED
            - DRIVER_ARRIVED
            - TRIP_COMPLETED
            - PAYMENT_RESULT
            - NEW_TRIP
            - TRIP_UPDATED

        tripId:
          type: string
          nullable: true
          example: CD001

        paymentId:
          type: string
          nullable: true
          example: PAY001

        status:
          type: string
          enum:
            - PENDING
            - SENT
            - FAILED
          example: SENT

        createdAt:
          type: string
          format: date-time

        sentAt:
          type: string
          format: date-time
          nullable: true


    ErrorResponse:
      type: object

      required:
        - errorCode
        - message

      properties:

        errorCode:
          type: string
          example: INVALID_NOTIFICATION

        message:
          type: string
          example: Dữ liệu thông báo không hợp lệ
