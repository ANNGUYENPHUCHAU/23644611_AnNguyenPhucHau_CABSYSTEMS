openapi: 3.0.3
info:
  title: CAB System - Notification Service API
  description: |
    API truy vấn thông báo cho khách hàng và tài xế.
    Traceability: FR16-FR17, BR07.
  version: 1.0.0

servers:
  - url: http://localhost:8085/api/v1
    description: Local Notification Service

tags:
  - name: Customer Notification
    description: FR16 - Thông báo cho khách hàng
  - name: Driver Notification
    description: FR17 - Thông báo cho tài xế

paths:
  /customers/{customerId}/notifications:
    get:
      tags: [Customer Notification]
      summary: Xem thông báo của khách hàng
      description: |
        FR16. Thông báo khi tiếp nhận yêu cầu, tài xế nhận chuyến,
        tài xế đến nơi, hoàn thành chuyến và có kết quả thanh toán.
      operationId: getCustomerNotifications
      security:
        - bearerAuth: []
      parameters:
        - name: customerId
          in: path
          required: true
          schema:
            type: string
            example: KH001
      responses:
        '200':
          description: Danh sách thông báo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationList'
        '401':
          description: Chưa xác thực

  /drivers/{driverId}/notifications:
    get:
      tags: [Driver Notification]
      summary: Xem thông báo của tài xế
      description: |
        FR17. Thông báo khi có chuyến mới hoặc có thay đổi
        liên quan đến chuyến đang thực hiện.
      operationId: getDriverNotifications
      security:
        - bearerAuth: []
      parameters:
        - name: driverId
          in: path
          required: true
          schema:
            type: string
            example: TX001
      responses:
        '200':
          description: Danh sách thông báo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationList'
        '401':
          description: Chưa xác thực

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    Notification:
      type: object
      required: [notificationId, recipientType, recipientId, eventType, message]
      properties:
        notificationId:
          type: string
          example: NT001
        recipientType:
          type: string
          enum: [CUSTOMER, DRIVER]
        recipientId:
          type: string
          example: KH001
        tripId:
          type: string
          nullable: true
          example: CD001
        eventType:
          type: string
          enum:
            - BOOKING_RECEIVED
            - DRIVER_ASSIGNED
            - DRIVER_ARRIVED
            - TRIP_COMPLETED
            - PAYMENT_RESULT
            - NEW_TRIP
            - TRIP_UPDATED
        message:
          type: string
          example: Tài xế đã nhận chuyến của bạn.
        createdAt:
          type: string
          format: date-time

    NotificationList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Notification'
